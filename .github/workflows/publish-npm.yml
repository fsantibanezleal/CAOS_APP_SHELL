name: publish-npm

# Trusted publishing (OIDC) to npm: no token is stored anywhere. The package's Trusted Publisher on
# npmjs.com names this repository, this workflow FILE NAME (publish-npm.yml) and the environment
# "npm"; renaming the file or the environment breaks publishing. npm removed 2FA-bypass granular
# tokens in 2026, which is why the earlier token-based publish stopped at 0.6.8.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write   # OIDC; npm mints a short-lived credential for this run
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm with trusted-publishing support (11.5.1 or newer)
        run: |
          npm install -g npm@latest
          npm --version

      - name: VERSION, package.json, CHANGELOG and the tag agree (ADR-0068)
        run: |
          set -euo pipefail
          python3 scripts/check_version_coherence.py .
          file_version="$(tr -d ' \r\n' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${file_version}"
          fi

      - run: npm ci

      - name: Unit and contract tests
        run: npm test

      - name: Publish through trusted publishing, with provenance
        run: npm publish --provenance --access public
