name: publish-npm

# Trusted publishing (OIDC) to npm: no token is stored anywhere. The package's Trusted Publisher on
# npmjs.com names this repository, this workflow FILE NAME (publish-npm.yml) and the environment
# "npm"; renaming the file or the environment breaks publishing. npm removed 2FA-bypass granular
# tokens in 2026, which is why the earlier token-based publish stopped at 0.6.8.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write   # OIDC; npm mints a short-lived credential for this run
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm with trusted-publishing support (11.5.1 or newer)
        run: |
          npm install -g npm@latest
          npm --version

      - name: VERSION, package.json, CHANGELOG and the tag agree (ADR-0068)
        run: |
          set -euo pipefail
          python3 scripts/check_version_coherence.py .
          file_version="$(tr -d ' \r\n' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            file_semver="$(python3 -c 'import re,sys; m=re.match(r"^(\d+)\.(\d+)\.(\d+)",sys.argv[1]); assert m; print(".".join(str(int(x)) for x in m.groups()))' "$file_version")"
            tag_semver="$(python3 -c 'import re,sys; m=re.match(r"^(\d+)\.(\d+)\.(\d+)",sys.argv[1]); assert m; print(".".join(str(int(x)) for x in m.groups()))' "$tag_version")"
            test "$tag_semver" = "$file_semver"
          fi

      - run: npm ci

      - name: Unit and contract tests
        run: npm test

      - name: Build the package before checking the published bytes
        run: npm run build

      - name: Publish through trusted publishing, with provenance
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" >/dev/null
          tarball_name="$(node -e 'const p=require("./package.json"); console.log(p.name.replace(/^@/, "").replace("/", "-") + "-" + p.version + ".tgz")')"
          tarball_path="$RUNNER_TEMP/$tarball_name"
          test -f "$tarball_path"
          local_integrity="$(node -e 'const fs=require("node:fs"); const crypto=require("node:crypto"); console.log("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball_path")"
          published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
          if [ -n "$published_integrity" ]; then
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "Published ${package_name}@${package_version} has different bytes" >&2
              exit 1
            fi
            echo "${package_name}@${package_version} is already published with matching integrity; no-op."
          else
            npm publish --ignore-scripts --provenance --access public
          fi
