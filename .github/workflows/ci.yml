name: CI

# ADR-0074: cheap checks only, trunk-only triggers, a concurrency group, a timeout on every job.
# This package is consumed by every CAOS web product, and until 2026-09-25 it had no CI at all:
# a release could ship with failing tests, with em-dashes in UI strings, or with VERSION,
# package.json, CHANGELOG and the tag disagreeing (which is exactly what 0.06.009 to 0.06.011 did).
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the distributable (tsup)
        run: npm run build
      - name: Unit and contract tests (node test runner, seconds, no browser)
        run: npm test

  browser:
    # The browser suites: the shell's components in a real browser (e2e/), and the gate's self-test (G15): the clean
    # fixture passes the full matrix and every planted defect fails the check that owns it. A gate that cannot fail on
    # its plant agrees with a broken app, so the gate is released only when this job is green.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the distributable (tsup)
        run: npm run build
      - name: Components in a real browser
        run: npm run test:browser
      - name: The gate proves itself (G15)
        run: npm run test:gate

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base-integrity guards
        run: |
          fail=0
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$' && ! git ls-files | grep -qx '.env.example'; then
            echo "::error::a real .env is tracked (only .env.example may be)"; fail=1; fi
          if git ls-files | grep -qE '(^|/)dist/'; then
            echo "::error::dist/ is tracked; the distributable is built on install and on publish"; fail=1; fi
          if git grep -nF 'D:\_Repos' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::leaked local machine path (D:\\_Repos) in a tracked file"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "guards: OK"; fi
          exit $fail
      - name: No em-dash or emoji in content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: CI budget, no training, trunk-only triggers (ADR-0074)
        run: python scripts/check_ci_budget.py
      - name: VERSION, package.json, CHANGELOG and the latest tag agree (ADR-0068)
        run: python scripts/check_version_coherence.py .
