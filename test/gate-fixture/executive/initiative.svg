<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="The executive at the desk with the winter deadline">
  <title>The executive at the desk with the winter deadline</title>
  <rect x="0" y="0" width="480" height="300" rx="10" fill="var(--color-surface)" stroke="var(--color-border)"/>
  <rect x="30" y="196" width="230" height="14" rx="3" fill="var(--color-surface-2)" stroke="var(--color-border)"/>
  <rect x="52" y="210" width="10" height="60" fill="var(--color-surface-2)" stroke="var(--color-border)"/>
  <rect x="228" y="210" width="10" height="60" fill="var(--color-surface-2)" stroke="var(--color-border)"/>
  <rect x="150" y="150" width="82" height="46" rx="4" fill="var(--color-surface-2)" stroke="var(--color-border)"/>
  <polyline points="160,184 178,170 194,178 222,160" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(100 190) scale(1.6)">
    <circle cx="0" cy="-34" r="11" fill="var(--color-accent)" stroke="var(--color-border)"/>
    <path d="M -16 0 Q -16 -22 0 -22 Q 16 -22 16 0 Z" fill="var(--color-accent)" stroke="var(--color-border)"/>
  </g>
  <text data-lang="en" x="100" y="232" text-anchor="middle" font-size="14" fill="var(--color-fg-subtle)">The executive</text>
  <text data-lang="es" x="100" y="232" text-anchor="middle" font-size="14" fill="var(--color-fg-subtle)">El ejecutivo</text>
  <text data-lang="en" x="140" y="288" text-anchor="middle" font-size="14" fill="var(--color-fg-subtle)">Hospital network</text>
  <text data-lang="es" x="140" y="288" text-anchor="middle" font-size="14" fill="var(--color-fg-subtle)">Red de hospitales</text>
  <rect x="300" y="40" width="150" height="120" rx="8" fill="var(--color-surface-2)" stroke="var(--color-border)"/>
  <rect x="300" y="40" width="150" height="30" rx="8" fill="var(--color-bad)"/>
  <text data-lang="en" x="375" y="61" text-anchor="middle" font-size="14" fill="var(--color-bg)" font-weight="600">Winter deadline</text>
  <text data-lang="es" x="375" y="61" text-anchor="middle" font-size="14" fill="var(--color-bg)" font-weight="600">Plazo de invierno</text>
  <circle cx="375" cy="112" r="26" fill="none" stroke="var(--color-bad)" stroke-width="3"/>
  <text data-lang="en" x="375" y="118" text-anchor="middle" font-size="18" fill="var(--color-fg)" font-weight="700">1 Dec</text>
  <text data-lang="es" x="375" y="118" text-anchor="middle" font-size="18" fill="var(--color-fg)" font-weight="700">1 dic</text>
  <text data-lang="en" x="375" y="196" text-anchor="middle" font-size="14" fill="var(--color-fg)">Keep every ward staffed</text>
  <text data-lang="es" x="375" y="196" text-anchor="middle" font-size="14" fill="var(--color-fg)">Todas las salas con personal</text>
  <text data-lang="en" x="375" y="216" text-anchor="middle" font-size="14" fill="var(--color-fg)">without cancelling surgery</text>
  <text data-lang="es" x="375" y="216" text-anchor="middle" font-size="14" fill="var(--color-fg)">sin cancelar cirugías</text>
  <path d="M 262 168 L 296 130" fill="none" stroke="var(--color-fg-faint)" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
