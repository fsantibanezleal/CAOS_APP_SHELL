  <circle cx="60" cy="200" r="26" fill="none" stroke="var(--color-bad)" stroke-width="3"/>
  <path d="M 60 200 L 60 184 M 60 200 L 72 206" fill="none" stroke="var(--color-bad)" stroke-width="3" stroke-linecap="round"/>
  <text data-lang="en" x="20" y="258" text-anchor="start" font-size="15" fill="var(--color-fg)">Seen too late</text>
  <text data-lang="es" x="20" y="258" text-anchor="start" font-size="15" fill="var(--color-fg)">Se ve demasiado tarde</text>
  <text data-lang="en" x="20" y="280" text-anchor="start" font-size="15" fill="var(--color-fg-subtle)">Surgery is cancelled</text>
  <text data-lang="es" x="20" y="280" text-anchor="start" font-size="15" fill="var(--color-fg-subtle)">Se cancela la cirugía</text>
